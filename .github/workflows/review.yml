name: Check review package
on:
  workflow_dispatch:
jobs:
  figures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r figure_reproduction/requirements-reproduce.txt
      - run: python review/check_archive.py
      - run: python review/reproduce_figures.py
      - uses: actions/upload-artifact@v4
        with:
          name: cellcompass-review-figures
          path: output/review_figures/*Figure_*.pdf
          retention-days: 14
